[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ckd-screening-study"
version = "1.0.0"
description = "Reliable and explainable low-cost CKD screening: nested validation, leakage audit and calibration study"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
boosting = ["xgboost>=2.0", "catboost>=1.2"]
explain = ["shap>=0.45", "interpret>=0.6"]
test = ["pytest>=8.0"]
all = [
    "xgboost>=2.0", "catboost>=1.2",
    "shap>=0.45", "interpret>=0.6",
    "pytest>=8.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
]
